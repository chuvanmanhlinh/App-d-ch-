name: Build Android APK - App Dich Truyen

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Unit Tests
        run: gradle testDebugUnitTest

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Rename APK Artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk AppDichTruyen-v1.0.0.apk

      - name: Upload APK to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: AppDichTruyen-APK
          path: AppDichTruyen-v1.0.0.apk
